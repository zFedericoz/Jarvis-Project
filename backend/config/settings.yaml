# =============================================================================
# J.A.R.V.I.S. - Configuration
# =============================================================================

llm:
  provider: ollama
  model: qwen2.5:14b
  # reflection_model: qwen2.5:14b  # scommenta per usare un modello diverso per auto-valutazione
  embedding_model: mxbai-embed-large
  host: ${OLLAMA_HOST:-http://localhost:11434}
  temperature: 0.3
  context_window: 4096
  num_gpu: -1           # -1 = auto (usa GPU se disponibile), 0 = CPU, N = numero layers GPU

speech:
  stt:
    engine: faster-whisper
    model: tiny
    device: cpu
    compute_type: int8
    language: auto
  tts:
    engine: edge-tts
    voice_sample: models/voice/jarvis_sample.wav
    device: cpu
    fallback:
      engine: edge-tts
      voice: it-IT-IsabellaNeural
  wake_word:
    engine: porcupine
    keyword: jarvis
    sensitivity: 0.5
    model_path: models/porcupine/jarvis.ppn

vision:
  enabled: true
  engine: yolov8
  model: yolov8n.pt
  device: cpu
  camera_id: 0

memory:
  short_term:
    engine: redis
    host: ${REDIS_HOST:-localhost}
    port: 6379
    ttl: 3600
  long_term:
    engine: chroma
    persist_dir: data/chroma_db
    collection: jarvis_memories

actions:
  enabled:
    - system_control
    - web_search
    - media_player
    - productivity
  web_search:
    engine: duckduckgo
    max_results: 5

audio:
  input_device: default
  output_device: default
  sample_rate: 16000
  channels: 1

server:
  host: 0.0.0.0
  port: 8765
  cors_origins:
    - http://localhost:5173
    - http://localhost:3000
    - http://localhost:80
    - http://localhost
